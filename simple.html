<style>
:root{--pill:rgba(255,255,255,.85);--ink:#2a2230;--ov:#f1e9da;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pill:rgba(60,48,80,.85);--ink:#f2ecf7;--ov:#1b1426}}

html,body{margin:0;height:100%;overflow:hidden;background:#f1e9da;overscroll-behavior:none;touch-action:none;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}

#dial-container {
 position: fixed; right: -70px; top: 50%; transform: translateY(-50%);
 width: 140px; height: 140px; border-radius: 50%;
 background: #1a1a1a;
 box-shadow: -5px 10px 25px rgba(26,18,42,0.7), inset -4px 0px 10px rgba(255,255,255,0.2), inset 4px 0px 10px rgba(26,18,42,0.8);
 z-index: 4; touch-action: none; cursor: grab;
 display: flex; align-items: center; justify-content: center;
}
#dial-container:active { cursor: grabbing; }
#dial {
 width: 110px; height: 110px; border-radius: 50%;
 background: conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
 box-shadow: inset 0 0 15px rgba(26,18,42,0.8), 0 5px 15px rgba(26,18,42,0.8);
 position: relative; transform: rotate(0deg);
}
#dial::after {
 content: ''; position: absolute; top: 5px; left: 5px; right: 5px; bottom: 5px;
 border-radius: 50%; background: linear-gradient(135deg, rgba(255,255,255,0.35) 0%, rgba(255,255,255,0) 50%, rgba(26,18,42,0.5) 100%);
 pointer-events: none;
}
#dial-preview{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:hsl(0,90%,55%);border:3px solid rgba(255,255,255,0.95);box-shadow:0 4px 12px rgba(26,18,42,0.5);pointer-events:none;z-index:6;display:flex;align-items:center;justify-content:center;font:800 11px system-ui;color:#fff;}

 background: white; border-radius: 2px; transform: translateY(-50%);

}

#start {

#start > * { z-index: 1; position: relative; }

.mb{border:2px solid transparent;border-radius:14px;padding:12px 10px;background:rgba(255,255,255,0.85);color:#1b1426;font:600 14px system-ui,sans-serif;display:flex;flex-direction:column;gap:8px;align-items:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);cursor:pointer;}

.go:hover { background: #8fff22; transform: translateY(-2px);}

<script>
(()=>{
const view=document.getElementById('view'),vx=view.getContext('2d');
const R=Math.random,rr=(a,b)=>a+R()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),TAU=6.2832;
const hsl=(h,s,l,a=1)=>`hsla(${(h%360)|0},${s|0}%,${clamp(l,0,100)|0}%,${a})`;
const BG='#f1e9da';
let W=0,H=0,DPR=1,paint=null,px=null;
const paper=(()=>{const c=document.createElement('canvas');c.width=c.height=160;const g=c.getContext('2d');
for(let i=0;i<1800;i++){g.fillStyle=`rgba(${R()<.5?'90,70,40':'255,255,255'},${rr(.02,.07)})`;g.fillRect(R()*160,R()*160,rr(1,2.2),rr(1,2.2));}return c;})();
function fillBG(){px.fillStyle=BG;px.fillRect(0,0,W,H);px.fillStyle=px.createPattern(paper,'repeat');px.fillRect(0,0,W,H);}
function resize(){
 const w=innerWidth,h=innerHeight,d=Math.min(devicePixelRatio||1,2);
 if(w===W&&h===H&&d===DPR)return;
 const old=paint,ow=W,oh=H;W=w;H=h;DPR=d;
 view.width=W*DPR;view.height=H*DPR;
 paint=document.createElement('canvas');paint.width=W*DPR;paint.height=H*DPR;
 px=paint.getContext('2d');px.setTransform(DPR,0,0,DPR,0,0);fillBG();
 if(old)px.drawImage(old,0,0,ow,oh);
}
addEventListener('resize',resize);resize();
const MOODS={
 Dread:[[235,60,22],[260,55,30],[220,70,38],[0,0,12],[350,70,32],[150,45,30], [80,60,15], [300,50,15], [0,80,45], [200,90,12]],
 Melancholy:[[215,40,45],[230,35,60],[200,30,70],[250,30,35],[30,35,55], [190,50,20], [210,15,85], [260,20,40], [180,60,30], [0,0,25]],
 Rage:[[0,90,45],[12,95,50],[350,85,30],[28,100,55],[0,0,12], [20,100,60], [330,100,40], [0,100,20], [45,100,60], [350,100,15]],
 Joy:[[50,100,55],[330,85,62],[175,80,48],[25,95,58],[95,70,55], [190,90,60], [300,80,65], [60,100,70], [15,100,65], [140,80,50]],
 Serenity:[[185,45,60],[160,40,58],[210,50,65],[45,40,75],[270,25,68], [190,30,85], [150,30,70], [220,40,30], [30,40,80], [280,30,40]],
 Nostalgia:[[35,60,58],[15,50,50],[48,55,65],[200,30,50],[340,35,60], [25,40,30], [60,30,40], [180,25,45], [350,30,40], [40,70,75]],
 Euphoria:[[300,90,60],[190,100,55],[55,100,60],[270,90,62],[330,95,60], [160,100,50], [350,100,65], [200,100,75], [20,100,55], [280,100,40]]
};
let mood='Dread',micOn=false;
const MIX_MODES = ['overlay', 'screen', 'overlay', 'hard-light', 'overlay', 'screen'];
function makePalette(bias){
 const _hs = (typeof hueShift!=='undefined'?hueShift:0);
 const L=(mood==='Chaos'?Array.from({length:12},()=>[R()*360,rr(60,100),rr(10,90)]):MOODS[mood].slice()).sort((a,b)=>a[2]-b[2]);
 let pick;
 if(bias==null)pick=L.slice().sort(()=>R()-.5).slice(0,6);
 else{const k=Math.round(bias*(L.length-1)),s=clamp(k-2,0,L.length-6);pick=L.slice(s,s+6);}
 const p=pick.map((o,i)=>({
  h:o[0]+_hs+rr(-8,8),
  s:clamp(o[1]+rr(-6,6),12,100),
  l:clamp(o[2]+rr(-5,5),12,95),
  type:i%2?'wc':'oil',
  mix: MIX_MODES[Math.floor(R() * MIX_MODES.length)]
 }));
 if(R()<.5)p.forEach(q=>q.type=q.type==='oil'?'wc':'oil');
 return p;
}
function pts(R,irr,n){
  const p=[];
  for(let i=0;i<n;i++){
    const a=i/n*TAU;
    // Add organic variation - more irregular for realism
    const wave = Math.sin(a*3)*0.08 + Math.sin(a*7)*0.04 + (Rnd()-0.5)*irr*0.5;
    const r=R*(1+wave);
    p.push([Math.cos(a)*r, Math.sin(a)*r]);
  }
  return p;
}
function Rnd(){ return Math.random(); }

function splat(type,x,y,R,col,rot,spread){
  px.save();
  px.translate(x,y);
  px.rotate(rot);
  
  if(type==='oil'){
    // HYPER REALISTIC OIL - thick impasto
    const blob = pts(R, 0.28, 20);
    
    // 1. Drop shadow - dark underneath for depth
    px.save();
    px.translate(R*0.12, R*0.18);
    px.globalCompositeOperation='overlay';
    px.globalAlpha=0.22;
    px.fillStyle='rgba(26,18,42,1)';
    px.beginPath(); px.moveTo(blob[0][0],blob[0][1]);
    for(let i=1;i<blob.length;i++){const a=blob[i],b=blob[(i+1)%blob.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;px.quadraticCurveTo(a[0],a[1],mx,my);}
    px.closePath(); px.fill();
    px.restore();
    
    // 2. Base oil color - thick, opaque, with mix mode for canvas interaction
    px.globalCompositeOperation = col.mix || 'hard-light';
    px.globalAlpha=0.95;
    px.fillStyle=hsl(col.h,col.s,Math.min(95, col.l+5));
    px.beginPath(); px.moveTo(blob[0][0],blob[0][1]);
    for(let i=1;i<blob.length;i++){const a=blob[i],b=blob[(i+1)%blob.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;px.quadraticCurveTo(a[0],a[1],mx,my);}
    px.closePath(); px.fill();
    
    // 3. Inner darker core - pigment density
    px.globalCompositeOperation='overlay';
    px.globalAlpha=0.18;
    px.fillStyle=hsl(col.h, Math.min(100,col.s+15), Math.max(10,col.l-18));
    const innerR = R*0.65;
    const innerBlob = pts(innerR, 0.18, 16);
    px.beginPath(); px.moveTo(innerBlob[0][0],innerBlob[0][1]);
    for(let i=1;i<innerBlob.length;i++){const a=innerBlob[i],b=innerBlob[(i+1)%innerBlob.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;px.quadraticCurveTo(a[0],a[1],mx,my);}
    px.closePath(); px.fill();
    
    // 4. Palette knife ridges - light catching impasto texture
    px.globalCompositeOperation='source-over';
    px.globalAlpha=0.35;
    px.strokeStyle=hsl(col.h, col.s, Math.min(95,col.l+25));
    px.lineWidth=Math.max(0.8, R*0.04);
    px.lineCap='round';
    for(let i=0;i<3;i++){
      const ridgeA = (i/3)*TAU + rot*0.5;
      px.beginPath();
      px.moveTo(Math.cos(ridgeA)*R*0.2, Math.sin(ridgeA)*R*0.2);
      px.quadraticCurveTo(Math.cos(ridgeA+0.3)*R*0.6, Math.sin(ridgeA+0.3)*R*0.6, Math.cos(ridgeA+0.5)*R*0.9, Math.sin(ridgeA+0.5)*R*0.9);
      px.stroke();
    }
    
    // 5. Specular highlight - top-left light source, glossy wet oil
    px.globalAlpha=0.42;
    px.fillStyle='rgba(255,255,255,0.85)';
    px.beginPath(); px.ellipse(-R*0.25, -R*0.32, R*0.38, R*0.16, -0.6, 0, TAU); px.fill();
    px.globalAlpha=0.22;
    px.beginPath(); px.ellipse(-R*0.15, -R*0.18, R*0.18, R*0.08, -0.6, 0, TAU); px.fill();
    
    // 6. Subtle canvas texture through oil - bristle marks
    px.globalAlpha=0.12;
    px.strokeStyle='rgba(26,18,42,0.3)';
    px.lineWidth=0.5;
    for(let i=0;i<4;i++){
      px.beginPath();
      px.moveTo(-R*0.8 + Math.random()*R*0.3, -R*0.6 + i*R*0.3);
      px.lineTo(R*0.8 - Math.random()*R*0.2, -R*0.6 + i*R*0.3 + (Math.random()-0.5)*R*0.1);
      px.stroke();
    }
    
  }else{
    // HYPER REALISTIC WATERCOLOR - wet-on-wet, granulation, blooms
    const layers = 3;
    for(let L=0; L<layers; L++){
      const layerR = R * (1 - L*0.12);
      const layerAlpha = L===0 ? 0.28 : L===1 ? 0.18 : 0.12;
      const blob = pts(layerR, 0.32 + L*0.08, 28);
      
      px.globalCompositeOperation='overlay';
      px.globalAlpha=layerAlpha * (1 - L*0.15);
      // Slight hue shift for depth
      const hueShift = (L-1)*3;
      px.fillStyle=hsl(col.h+hueShift, Math.max(20,col.s - L*8), col.l + L*2);
      px.beginPath(); px.moveTo(blob[0][0],blob[0][1]);
      for(let i=1;i<blob.length;i++){const a=blob[i],b=blob[(i+1)%blob.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;px.quadraticCurveTo(a[0],a[1],mx,my);}
      px.closePath(); px.fill();
    }
    
    // Wet edge - darker pigment pushed to edge (characteristic watercolor)
    px.globalCompositeOperation='overlay';
    px.globalAlpha=0.22;
    px.strokeStyle=hsl(col.h, Math.min(100,col.s+10), Math.max(15,col.l-12));
    px.lineWidth=R*0.08;
    const edgeBlob = pts(R*0.98, 0.28, 24);
    px.beginPath(); px.moveTo(edgeBlob[0][0],edgeBlob[0][1]);
    for(let i=1;i<edgeBlob.length;i++){const a=edgeBlob[i],b=edgeBlob[(i+1)%edgeBlob.length];const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;px.quadraticCurveTo(a[0],a[1],mx,my);}
    px.closePath(); px.stroke();
    
    // Granulation - pigment particles settling into paper texture
    px.globalCompositeOperation='overlay';
    const granules = Math.floor(R*0.6);
    for(let i=0;i<granules;i++){
      const ang = Math.random()*TAU;
      const dist = Math.pow(Math.random(), 0.7) * R*0.85;
      const gx = Math.cos(ang)*dist;
      const gy = Math.sin(ang)*dist;
      const gr = Math.random()*1.2 + 0.3;
      px.globalAlpha = 0.12 + Math.random()*0.18;
      px.fillStyle = hsl(col.h, col.s+10, col.l-15);
      px.beginPath(); px.arc(gx,gy,gr,0,TAU); px.fill();
    }
    
    // Backrun / bloom effect - occasional lighter center
    if(Math.random()<0.35){
      px.globalCompositeOperation='screen';
      px.globalAlpha=0.08;
      px.fillStyle='rgba(255,255,255,1)';
      px.beginPath(); px.arc(R*0.15, R*0.1, R*0.35, 0, TAU); px.fill();
    }
  }
  
  px.restore();
  
  // Extra texture for large oil blobs - impasto crumbs
  if(R>32 && type==='oil'){
    const k = 4 + ((R/12)|0);
    for(let i=0;i<k;i++){
      const a = R* (0.3 + Math.random()*0.6);
      const an = rot + (Math.random()-0.5)*1.2;
      const sz = 1.2 + Math.random()*3.2;
      // Small raised dots
      px.save();
      px.globalCompositeOperation='source-over';
      px.globalAlpha=0.65;
      const dx = x + Math.cos(an)*a;
      const dy = y + Math.sin(an)*a;
      px.fillStyle=hsl(col.h, col.s, col.l+18);
      px.beginPath(); px.arc(dx, dy, sz, 0, TAU); px.fill();
      // Tiny highlight on dot
      px.globalAlpha=0.5;
      px.fillStyle='rgba(255,255,255,0.7)';
      px.beginPath(); px.arc(dx - sz*0.2, dy - sz*0.25, sz*0.4, 0, TAU); px.fill();
      px.restore();
    }
  }
}

function dot(type,x,y,r,col){
  px.save();
  if(type==='oil'){
    // Realistic oil dot - 3D bead
    px.globalCompositeOperation=col.mix||'hard-light';
    px.globalAlpha=0.92;
    px.fillStyle=hsl(col.h,col.s,col.l);
    px.beginPath(); px.arc(x,y,r,0,TAU); px.fill();
    // Highlight

// Ultimate dark blending - replaces black with rich dark indigo + umber mix
function ultimateDark(h,s,l){
  // If lightness would be black (<12), replace with rich dark blend
  if(l < 12){
    // Create ultimate dark from complementary darks, not black
    // Mix dark indigo (260,60,14) + burnt umber (25,45,14) + deep violet (280,35,12)
    // Preserve hue hint but make it rich
    const darkBaseHues = [260, 25, 280, 220, 18];
    const nearHue = darkBaseHues.reduce((prev,curr)=> Math.abs(curr-h) < Math.abs(prev-h) ? curr : prev);

    const richH = (h*0.35 + nearHue*0.65) % 360;

    const richL = 12 + Math.random()*6; // 12-18%, never black
    return {h:richH, s:richS, l:richL};
  }
  return {h,s,l};
}

// Override hsl creation to enforce no black
function hslNoBlack(h,s,l, alpha){
  const d = ultimateDark(h,s,l);
  if(alpha!=null) return `hsla(${d.h},${d.s}%,${d.l}%,${alpha})`;

}

  if(dialPreview) dialPreview.style.transform='translate(-50%,-50%) scale(1.25)';
});

function endDial(e){
  if(e.pointerId!==dialPointerId) return;
  isSpinning = false;
  dialPointerId=null;
  try{dialCtr.releasePointerCapture(e.pointerId);}catch(_){}
  if(dialPreview) dialPreview.style.transform='translate(-50%,-50%) scale(1)';
  setTimeout(()=>{
    const hint=document.getElementById('hint');
    if(hint){ hint.textContent='Press & hold to load the brush · drag to paint · release to explode'; hint.style.opacity=0.8; setTimeout(()=>hint.style.opacity=0, 2500); }
  }, 800);
}

dialCtr.addEventListener('pointermove', e => { if(isSpinning) updateDial(e); });
dialCtr.addEventListener('pointerup', endDial);
dialCtr.addEventListener('pointercancel', endDial);

// Hook charger creation to use current hueShift immediately
const origSet = chargers.set.bind(chargers);
chargers.set = function(k,v){
  v.basePal = v.pal.map(c => c.h);
  if(hueShift!==0){
    v.pal.forEach((c,i)=>{ c.h = (v.basePal[i] + hueShift) % 360; });
  }
  return origSet(k,v);
};

view.addEventListener('contextmenu',e=>e.preventDefault());
view.addEventListener('pointerdown',e=>{
 e.preventDefault();try{view.setPointerCapture(e.pointerId);}catch(_){}
 const _activeCount = chargers.size; const _thisHue = (typeof hueShift!=='undefined'?hueShift:0); chargers.set(e.pointerId,{x:e.clientX,y:e.clientY,t0:performance.now(),charge:0,pal:makePalette(_thisHue/360),snd:chargeSound(_activeCount),ph:R()*6,dead:false,lt:performance.now(),sp:0,va:0,trav:0,vb:0, baseHue:_thisHue, fingerIndex:_activeCount});
 hint.style.opacity=0;
});
function buzz(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function stroke(ch){
 const sp=ch.sp,col=ch.pal[(R()*ch.pal.length)|0],x=ch.x,y=ch.y;
 if(sp<.5){const r=5+ch.charge*9+(.5-sp)*10;splat(col.type,x,y,r,col,R()*TAU,.05);
  if(R()<.55)addDrip(col.type,x,y+r*.4,r,col,rr(.1,1));buzz(5);}
 else{const n=2+((R()*3)|0);for(let i=0;i<n;i++)flying.push({x,y,a:ch.va+rr(-.45,.45),dist:rr(40,120)+sp*40,size:rr(1.5,4),col,type:col.type,t:0,T:rr(.1,.22)});}
}
view.addEventListener('pointermove',e=>{
 if(e.clientX < -20 || e.clientX > innerWidth+20 || e.clientY < -20 || e.clientY > innerHeight+20){
   const ch=chargers.get(e.pointerId); if(ch){ if(ch.snd) ch.snd.stop(); chargers.delete(e.pointerId); if(navigator.vibrate) try{navigator.vibrate(10);}catch(_){} } if(typeof pushActive!=='undefined' && pushActive) pushActive=false; return;
 }
 if(typeof currentMode!=='undefined' && (currentMode==='push' || currentMode==='blend')){
   if(!pushActive) return; const dx=e.clientX-pushLastX, dy=e.clientY-pushLastY; const dist=Math.hypot(dx,dy);
   if(dist>1){ const radius=currentMode==='push' ? (dist<10?68:52) : (dist<8?52:38); pushPaint(e.clientX, e.clientY, dx, dy, radius, currentMode); pushLastX=e.clientX; pushLastY=e.clientY; if(navigator.vibrate && dist>12) try{navigator.vibrate(5);}catch(_){} } return;
 }
 const ch=chargers.get(e.pointerId);if(!ch)return; const now=performance.now(),dt=Math.max(1,now-ch.lt),dx=e.clientX-ch.x,dy=e.clientY-ch.y,d=Math.hypot(dx,dy); ch.lt=now;ch.sp=ch.sp*.6+(d/dt)*.4;if(d>.5)ch.va=Math.atan2(dy,dx); ch.x=e.clientX;ch.y=e.clientY;ch.trav+=d; const step=ch.sp<.5?14:26;let g=0;while(ch.trav>=step&&g++<4){ch.trav-=step;stroke(ch);}
});
function release(e){ if(typeof currentMode!=='undefined' && (currentMode==='push' || currentMode==='blend')){ pushActive=false; return; } const ch=chargers.get(e.pointerId);if(!ch)return;chargers.delete(e.pointerId);ch.dead=true;if(ch.snd)ch.snd.stop();explode(ch);}
function cancelCharge(e){
 const ch=chargers.get(e.pointerId);if(!ch)return;
 chargers.delete(e.pointerId); ch.dead=true; if(ch.snd) ch.snd.stop();
 try{ const ac=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); const o=ac.createOscillator(), g=ac.createGain(); o.frequency.value=220; o.type='sine'; g.gain.setValueAtTime(0.12, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.12); o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime+0.13); }catch(_){}
}
view.addEventListener('pointercancel', cancelCharge);
view.addEventListener('pointerleave', (e)=>{ if(e.clientX <=0 || e.clientX >= innerWidth || e.clientY <=0 || e.clientY >= innerHeight){ cancelCharge(e); } });

view.addEventListener('pointerup',release);view.addEventListener('pointercancel',release);
document.getElementById('clr').addEventListener('click',()=>{fillBG();drips.length=0;flying.length=0;});
const $=id=>document.getElementById(id),grid=$('moods'),start=$('start'),shot=$('shot');
let an=null,micBuf=null,micStream=null,lastOn=0,onsets=[],prevR=0,lastDrip=0,lastPitch=0,mf=0,nt=0;
Object.keys(MOODS).concat(['Chaos']).forEach(n=>{
 const b=document.createElement('button'),cols=MOODS[n]||[[0,90,55],[60,90,55],[120,80,50],[200,90,55],[290,85,58]];
 b.className='mb'+(n===mood?' sel':'');
 b.innerHTML='<span>'+n+'</span><em>'+cols.slice(0,5).map(o=>`<i style="background:hsl(${o[0]},${o[1]}%,${o[2]}%)"></i>`).join('')+'</em>';
 b.onclick=()=>{mood=n;[...grid.children].forEach(x=>x.classList.toggle('sel',x===b));};grid.appendChild(b);
});
function note(t){hint.textContent=t;hint.style.opacity=1;clearTimeout(nt);nt=setTimeout(()=>hint.style.opacity=0,4500);}
function setMic(){$('mic').textContent=micOn?'🎤 On':'🎤 Off';}
function detectPitch(b,sr){
 const maxL=Math.floor(sr/70),minL=Math.floor(sr/1000),M=b.length-maxL-1;let e=0;
 for(let i=0;i<M;i+=2)e+=b[i]*b[i];if(e<1e-3)return 0;
 const c=new Float32Array(maxL+2);
 for(let L=minL;L<=maxL;L++){let s=0;for(let i=0;i<M;i+=2)s+=b[i]*b[i+L];c[L]=s;}
 let fell=false;
 for(let L=minL+1;L<maxL;L++){if(c[L]<.25*e)fell=true;if(fell&&c[L]>c[L-1]&&c[L]>=c[L+1]&&c[L]>.45*e)return sr/L;}
 return 0;
}
async function micStart(){
 try{const a=audio();if(!a)throw 0;
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  const src=a.createMediaStreamSource(micStream);an=a.createAnalyser();an.fftSize=2048;src.connect(an);micBuf=new Float32Array(an.fftSize);micOn=true;note('Listening… play or sing');
 }catch(e){micOn=false;note('Mic blocked here. Open this page in its own tab or allow microphone access.');}
 setMic();
}
function micStop(){micOn=false;if(micStream)micStream.getTracks().forEach(t=>t.stop());micStream=null;an=null;setMic();}
function micTick(now){
 an.getFloatTimeDomainData(micBuf);let s=0;for(let i=0;i<micBuf.length;i++)s+=micBuf[i]*micBuf[i];const rms=Math.sqrt(s/micBuf.length);
 if(++mf%3===0){const f=detectPitch(micBuf,ac.sampleRate);if(f)lastPitch=f;}
 const bias=lastPitch?clamp(Math.log2(lastPitch/80)/3.65,0,1):.5;
 if(rms>.02&&rms>prevR*1.3+.008&&now-lastOn>110){
  lastOn=now;onsets.push(now);while(onsets.length&&now-onsets[0]>2000)onsets.shift();
  const rate=onsets.length/2;let c=clamp(clamp(rms*7,.15,1)*(rate>4?.45:rate>2?.75:1.15),.1,1);
  for(let i=0;i<(rate>4?2:1);i++)explode({x:rr(.12,.88)*W,y:rr(.12,.6)*H,charge:c,pal:makePalette(bias),sp:0,va:0});
 }else if(rms>.02&&now-lastOn>500&&now-lastDrip>350){lastDrip=now;addDrip(R()<.5?'oil':'wc',rr(.08,.92)*W,rr(0,.3)*H,rr(6,12),makePalette(bias)[0],0);}
 prevR=rms;
}
$('go-f').onclick=()=>{audio();if(micOn)micStop();start.style.display='none';document.getElementById('mode-bar').style.display='flex';document.getElementById('gravity-bar').style.display='flex';document.getElementById('color-toggle').style.display='block';if(document.getElementById('slider-container').style.display==='none' && colorMode==='wheel'){document.getElementById('dial-container').style.display='block';} };
$('go-m').onclick=async()=>{audio();start.style.display='none';document.getElementById('mode-bar').style.display='flex';document.getElementById('gravity-bar').style.display='flex';await micStart();};
$('mood').onclick=()=>{start.style.display='flex';};
$('mic').onclick=()=>{audio();micOn?micStop():micStart();};
$('sv').onclick=()=>{$('shotimg').src=paint.toDataURL('image/png');shot.style.display='flex';};
$('shotx').onclick=()=>{shot.style.display='none';};
function drawCharger(ch,now){
 const c=ch.charge,t=now/1000,rad=14+Math.pow(c,.85)*72,jit=c>.6?(c-.6)*5:0,x=ch.x+(R()-.5)*jit,y=ch.y+(R()-.5)*jit,p0=ch.pal[0];
 const gr=vx.createRadialGradient(x,y,rad*.3,x,y,rad*2.6);gr.addColorStop(0,hsl(p0.h,90,60,.35));gr.addColorStop(1,hsl(p0.h,90,60,0));
 vx.fillStyle=gr;vx.beginPath();vx.arc(x,y,rad*2.6,0,TAU);vx.fill();
 ch.pal.forEach((p,i)=>{const a=t*(2+c*5)*(i%2?1:-1)+i*TAU/ch.pal.length+ch.ph,o=rad*.38;
  vx.fillStyle=hsl(p.h,p.s,p.l);vx.beginPath();vx.arc(x+Math.cos(a)*o,y+Math.sin(a)*o,rad*(.62+.08*Math.sin(t*9+i)),0,TAU);vx.fill();});
 vx.fillStyle='rgba(255,255,255,.3)';vx.beginPath();vx.ellipse(x-rad*.3,y-rad*.35,rad*.3,rad*.15,-.6,0,TAU);vx.fill();
 vx.save();vx.strokeStyle=hsl(p0.h,90,45,.7);vx.lineWidth=2+c*3;vx.setLineDash([10,8]);vx.lineDashOffset=-t*40;
 vx.beginPath();vx.arc(x,y,rad*1.55+Math.sin(t*(6+c*14))*3*(.5+c),0,TAU);vx.stroke();vx.restore();
}
let last=performance.now();
function frame(now){try{tick(now);}catch(err){console.error(err);}requestAnimationFrame(frame);}
function tick(now){
 now=Math.max(now,performance.now());const dt=clamp((now-last)/1000,0,.05);last=now;
 if(micOn&&an)micTick(now);
 chargers.forEach(ch=>{ch.charge=clamp((now-ch.t0)/2400,0,1);ch.sp*=Math.max(0,1-dt*4);
  if(now-ch.vb>180-120*ch.charge){ch.vb=now;buzz(8+ch.charge*22);}
  const k=1+((ch.charge*5+R()*1.5)|0);
  for(let i=0;i<k;i++)motes.push({ch,a:R()*TAU,r:rr(90,260),w:rr(1.5,3.5)*(R()<.5?1:-1),v:rr(120,220),s:rr(1.5,4),col:ch.pal[(R()*ch.pal.length)|0]});});
 for(let i=flying.length-1;i>=0;i--){const f=flying[i];f.t+=dt/f.T;if(f.t>=1){land(f);flying.splice(i,1);}}
 if(typeof gravityOn==='undefined' || gravityOn) stepDrips(dt);
 vx.setTransform(DPR,0,0,DPR,0,0);vx.clearRect(0,0,W,H);
 vx.save();
 if(shake.t>0){shake.t-=dt;const m=shake.m*Math.max(0,shake.t/.25);vx.translate((R()-.5)*m,(R()-.5)*m);}
 vx.drawImage(paint,0,0,W,H);
 for(const d of drips)if(d.t>=0)head(vx,d);
 vx.lineCap='round';
 for(const f of flying){
  const e=t=>1-Math.pow(1-t,2.2),a=e(f.t),b=e(Math.max(0,f.t-.2)),co=Math.cos(f.a),si=Math.sin(f.a);
  vx.strokeStyle=hsl(f.col.h,f.col.s,f.col.l,f.type==='oil'?.95:.6);vx.lineWidth=f.size*(.9+.5*f.t)*1.1;
  vx.beginPath();vx.moveTo(f.x+co*f.dist*b,f.y+si*f.dist*b);vx.lineTo(f.x+co*f.dist*a,f.y+si*f.dist*a);vx.stroke();
 }
 for(let i=rings.length-1;i>=0;i--){const g=rings[i];g.t+=dt;const p=g.t/.5;if(p>=1){rings.splice(i,1);continue;}
  const rad=g.max*(1-Math.pow(1-p,3));
  if(p<.35){const fl=vx.createRadialGradient(g.x,g.y,0,g.x,g.y,g.max*.5);fl.addColorStop(0,`rgba(255,255,255,${.6*(1-p/.35)})`);fl.addColorStop(1,'rgba(255,255,255,0)');
   vx.fillStyle=fl;vx.beginPath();vx.arc(g.x,g.y,g.max*.5,0,TAU);vx.fill();}
  vx.strokeStyle=hsl(g.h,90,55,(1-p)*.7);vx.lineWidth=6*(1-p)+1;vx.beginPath();vx.arc(g.x,g.y,rad,0,TAU);vx.stroke();}
 for(let i=motes.length-1;i>=0;i--){const m=motes[i];
  if(m.ch.dead||m.r<6){motes.splice(i,1);continue;}
  m.v*=1+dt*1.4;m.r-=m.v*dt;m.a+=m.w*dt;
  const x=m.ch.x+Math.cos(m.a)*m.r,y=m.ch.y+Math.sin(m.a)*m.r,pr=m.r+m.v*.03,pa=m.a-m.w*.03;
  vx.strokeStyle=hsl(m.col.h,m.col.s,m.col.l,.85);vx.lineWidth=m.s;
  vx.beginPath();vx.moveTo(m.ch.x+Math.cos(pa)*pr,m.ch.y+Math.sin(pa)*pr);vx.lineTo(x,y);vx.stroke();}
 chargers.forEach(ch=>drawCharger(ch,now));
 vx.restore();
}
requestAnimationFrame(frame);
})();
